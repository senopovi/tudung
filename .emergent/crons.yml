crons:
  - name: cek-akun-petugas
    description: "Cek harian 08.00 WIB: pengingat & nonaktif otomatis akun petugas, serta email pengingat iuran (mode Otomatis)"
    cron: "0 8 * * *"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/akun"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
